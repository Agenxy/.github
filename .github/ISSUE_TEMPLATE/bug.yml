name: Bug report
description: Something behaves differently from what it says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A reproduction is worth more than a
        description, and a failing test is worth more than both, but do not let
        the absence of either stop you filing.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: Commands, config, and anything about your setup that seems relevant.
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of the tool's version command, or the commit you built from.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.2 arm64, Ubuntu 24.04 amd64, ...
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots, or a guess about the cause. Redact anything private first.
