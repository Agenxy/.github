name: Feature or change
description: Something that should exist, or should work differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where it got awkward. Describe the situation rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine; so is "no idea, but this hurts".
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you are using today, and why they are not enough.
